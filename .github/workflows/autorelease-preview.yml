name: Auto release excalidraw preview
jobs:
  Auto-release-excalidraw-preview:
    name: Auto release preview
    if: github.event.comment.body == '@excalibot trigger release' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |-
        BODY='${{ toJSON(github.event.comment.body) }}'
        IS_PR='${{ toJSON(github.event.issue.pull_request) }}'
        printf '%s\n' "GERALT_DBG comment.body=$BODY"
        printf '%s\n' "GERALT_DBG issue.is_pr=$IS_PR"
      continue-on-error: true
    - name: GERALT debug probe
      run: |-
        SHA='${{ steps.sha.outputs.result }}'
        printf '%s\n' "GERALT_DBG pr_head_sha=$SHA"
      continue-on-error: true
    - name: Get PR SHA
      id: sha
      uses: actions/github-script@v4
      with:
        result-encoding: string
        script: |
          const { owner, repo, number } = context.issue;
          const pr = await github.pulls.get({
            owner,
            repo,
            pull_number: number,
          });
          return pr.data.head.sha
    - uses: actions/checkout@v2.7.0
      with:
        ref: ${{ steps.sha.outputs.result }}
        fetch-depth: 2
    - name: Setup Node.js 14.x
      uses: actions/setup-node@v2
      with:
        node-version: 14.x
    - name: GERALT debug probe
      run: |-
        BODY='${{ toJSON(github.event.comment.body) }}'
        ISSUE='${{ toJSON(github.event.issue.number) }}'
        printf '%s\n' "GERALT_DBG issue.number=$ISSUE"
        printf '%s\n' "GERALT_DBG comment.body=$BODY"
      continue-on-error: true
    - name: Set up publish access
      run: |
        npm config set //registry.npmjs.org/:_authToken ${NPM_TOKEN}
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    - name: Auto release preview
      id: autorelease
      run: |
        yarn add @actions/core
        yarn autorelease preview ${{ github.event.issue.number }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
    - edited
